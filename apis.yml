aid: frontera
name: Frontera
description: >-
  Frontera (Frontera Health) is an AI-assisted clinical documentation company for
  behavioral health. Its software automates assessment and diagnosis report writing
  for Board Certified Behavior Analysts (BCBAs) and clinical psychologists working in
  Applied Behavior Analysis (ABA) and autism care, cutting report time from 6-10 hours
  to 2-3 hours. The platform pairs a BCBA-trained AI Assessment Builder and Diagnosis
  Builder with digital phenotyping, and is delivered as a HIPAA-compliant web
  application (customer login at portal.fronterahealth.com) rather than a public API.
  Frontera is a venture-backed portfolio company of Lightspeed Venture Partners. This
  API Evangelist profile tracks the company's public developer and security surface;
  as of this pass Frontera publishes no public API, developer portal, OpenAPI, SDKs,
  or MCP server.
